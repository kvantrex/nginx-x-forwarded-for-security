services:
  app:
    image: traefik/whoami:latest
    networks:
      net:
        ipv4_address: 172.20.0.10

  nginx1:
    image: nginx:alpine
    ports: ["8081:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: { net: { ipv4_address: 172.20.0.2 } }
    depends_on: [nginx2]

  nginx2:
    image: nginx:alpine
    ports: ["8082:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: { net: { ipv4_address: 172.20.0.3 } }
    depends_on: [nginx3]

  nginx3:
    image: nginx:alpine
    ports: ["8083:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: { net: { ipv4_address: 172.20.0.4 } }
    depends_on: [app]

networks:
  net:
    driver: bridge
    ipam:
      config: [{ subnet: 172.20.0.0/24 }]
