version: '3.8'

services:
  app:
    image: traefik/whoami:latest
    networks:
      testnet:
        ipv4_address: 172.20.0.10

  nginx1:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx1.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      testnet:
        ipv4_address: 172.20.0.2
    depends_on: [nginx2]

  nginx2:
    image: nginx:latest
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx2.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      testnet:
        ipv4_address: 172.20.0.3
    depends_on: [nginx3]

  nginx3:
    image: nginx:latest
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx3.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      testnet:
        ipv4_address: 172.20.0.4
    depends_on: [app]

networks:
  testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
