# Определяем доверенную сеть (внутренняя сеть Docker) и формируем X-Forwarder-For
map $remote_addr $xff_value {
    172.20.0.0/24   $proxy_add_x_forwarded_for;
    172.17.0.0/16   $proxy_add_x_forwarded_for;
    172.18.0.0/16   $proxy_add_x_forwarded_for;
    default         $remote_addr;
}

# Динамическая маршрутизация через заголовок X-Next-Hop
map $http_x_next_hop $upstream_target {
    default  "app";
    nginx1   nginx1;
    nginx2   nginx2;
    nginx3   nginx3;
}

map $http_x_next_hop $route_valid {
    ""       1;
    nginx1   1;
    nginx2   1;
    nginx3   1;
    default  0;
}

server {
    listen 80;
    server_name _;
    # Docker DNS для резолвинга переменных upstream
    resolver 127.0.0.11 valid=30s;

    location / {

        # Блокируем попытки инъекции в X-Next-Hop
        if ($route_valid = 0) {
            return 400;
        }

        proxy_pass http://$upstream_target:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $xff_value;
        # Очищаем заголовок маршрутизации, чтобы не зацикливать цепочку
        proxy_set_header X-Next-Hop        "";

    }
}
